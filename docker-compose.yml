version: '3.8'

services:
  # PostgreSQL Relational Database
  postgres:
    image: postgres:16-alpine
    container_name: interview-coach-db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_DB: interviewcoach
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    restart: unless-stopped

  # Backend API & Realtime Socket Server
  server:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: interview-coach-api
    environment:
      PORT: 5000
      DATABASE_URL: "postgresql://postgres:password@postgres:5432/interviewcoach?schema=public"
      JWT_SECRET: "ai-interview-coach-super-secret-key-2026"
      GEMINI_API_KEY: "${GEMINI_API_KEY}"
    ports:
      - "5000:5000"
    depends_on:
      - postgres
    restart: unless-stopped

  # React Frontend (Vite)
  client:
    build:
      context: ./client
      dockerfile: Dockerfile
    container_name: interview-coach-ui
    ports:
      - "5173:5173"
    depends_on:
      - server
    restart: unless-stopped

volumes:
  pgdata:
